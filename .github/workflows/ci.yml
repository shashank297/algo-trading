name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "30 2 * * 1"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
        include:
          - os: ubuntu-latest
            python-version: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Compile source
        run: python -m compileall -q main.py research.py ai_research data_platform experiments operations orchestration risk smartapi storage trading_stack validators tools tests
      - name: Run tests
        run: python -X faulthandler -m pytest -vv -o faulthandler_timeout=60

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install quality tools
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.lock -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Type check (Mypy)
        run: mypy ai_research data_platform experiments operations orchestration risk smartapi storage trading_stack validators tools main.py research.py scheduler.py
      - name: Type check (Pyright)
        run: pyright
      - name: Coverage
        run: |
          coverage run -m pytest -q
          coverage report --fail-under=80
          coverage report --include="risk/*.py,trading_stack/paper.py,trading_stack/portfolio.py,trading_stack/portfolio_paper.py,trading_stack/pipeline.py,trading_stack/datasets.py,trading_stack/certification.py,trading_stack/promotion.py,trading_stack/regime_transition.py,trading_stack/asset_state.py,smartapi/websocket_client.py,trading_stack/live_aggregator.py,storage/migrations/*.py" --fail-under=95
      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/dashboard/ui/package-lock.json
      - name: Install frontend dependencies
        working-directory: tools/dashboard/ui
        run: npm ci
      - name: Lint frontend
        working-directory: tools/dashboard/ui
        run: npm run lint
      - name: Build frontend
        working-directory: tools/dashboard/ui
        run: npm run build
